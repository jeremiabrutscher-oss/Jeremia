<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeremia OS">
<meta name="theme-color" content="#06102B">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Jeremia OS</title>
<style>
/* Jeremia OS: one dark-navy world (single theme by choice). Layout: phone-first column, bottom tabs; on wide screens a left sidebar. Style = playful chunky buttons (B) + progress rings (D). */
:root{
  --bg:#081230; --bg2:#060E26; --card:#10204F; --card2:#13245A; --line:#1E3576; --deep:#0A1638;
  --blue:#2F6BFF; --blue-d:#1B47B8; --blue2:#5B93FF; --blue3:#9CC0FF; --ice:#DCE8FF;
  --text:#F2F6FF; --muted:#9DAED6; --flame:#FFB648; --good:#46D6A0; --bad:#FF7A85;
  --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue3)}
:focus-visible{outline:3px solid var(--blue3);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
.shell{min-height:100%;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.brand{font-weight:900;font-size:21px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--blue2)}
.pill{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--card2);border:2px solid var(--line);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.flame{color:var(--flame)}.pill.xp{color:var(--blue3)}
.avatar{width:40px;height:40px;border-radius:20px;border:2px solid var(--line);background:var(--card2);font-weight:900;color:var(--text)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,14,38,.97);border-top:2px solid var(--card2);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:560px;margin:0 auto}
nav.tabs button{border:0;background:none;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted)}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--blue2)}
@media (min-width:900px){
  .shell{flex-direction:row}
  nav.tabs{position:sticky;top:0;height:100vh;width:220px;flex:none;border-top:0;border-right:2px solid var(--card2);padding:24px 12px}
  nav.tabs .in{display:flex;flex-direction:column;gap:4px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:14px;font-size:15px}
  nav.tabs button[aria-current="page"]{background:var(--card2)}
  main{max-width:720px;padding-top:28px;padding-bottom:48px}
}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--deep)}
.card+.card,.sec+.sec{margin-top:14px}
.sec{margin-top:22px}
.sec>h2{font-size:19px;font-weight:900;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.kicker{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ice)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 20px;font-weight:900;font-size:16px;background:var(--text);color:#0C1D4D;box-shadow:0 4px 0 #A9BFEF;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A9BFEF}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:var(--card);color:var(--text);border:2px solid var(--line);box-shadow:0 4px 0 var(--deep)}
.btn.ghost:active{box-shadow:0 1px 0 var(--deep)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.hero{border-radius:24px;padding:18px;background:var(--blue);box-shadow:0 6px 0 var(--blue-d);display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:23px;font-weight:900}
.hero .btn{align-self:flex-start}
.rings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:14px 6px;border-radius:22px;background:var(--card);border:2px solid var(--line)}
.ring{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--muted);border:0;background:none;padding:0}
.ring svg{width:54px;height:54px}
.bar{height:14px;border-radius:99px;background:var(--card2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue2);transition:width .5s}
.tile{position:relative;border-radius:20px;padding:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--deep);display:flex;flex-direction:column;gap:7px;min-height:118px;text-align:left;color:var(--text)}
.tile.done{border-color:#2E5BD1}
.tbtn{background:none;border:0;padding:0;margin:0;text-align:left;color:inherit;display:flex;flex-direction:column;gap:7px;font:inherit;cursor:pointer;padding-right:30px}
.tile .ic{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:#1C3170;color:var(--text)}
.tile.done .ic{background:#2E5BD1}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:15px;line-height:1.2}
.tile.done b{color:#9FB0D8}
.tile .meta{font-size:12px;font-weight:700;color:var(--muted)}
.tick{flex:none;width:32px;height:32px;border-radius:16px;border:2px solid var(--line);background:var(--deep);display:grid;place-items:center;color:var(--text)}
.tick svg{width:16px;height:16px}
.tick.on{background:var(--blue2);border-color:var(--blue2);color:#081230}
.ic.sm{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;background:#1C3170;color:var(--text);flex:none}.ic.sm svg{width:19px;height:19px}.ic.sm.on{background:#2E5BD1}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.chk{appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--blue2);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--deep)}
.chk:checked{background:var(--blue2);border-color:var(--blue2)}
.chk:checked::after{content:"";width:7px;height:13px;border:solid #081230;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
label.lc{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=file],textarea,select{width:100%;border-radius:12px;border:2px solid var(--line);background:var(--bg2);color:var(--text);padding:11px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:13px;font-weight:800;color:var(--ice)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px;background:var(--card2);color:var(--ice)}
.tag.warm{background:#3a2a0e;color:var(--flame)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.stat{padding:12px;border-radius:16px;background:var(--card2);border:2px solid var(--line)}
.stat small{display:block;font-size:12px;font-weight:800;color:var(--muted)}
.stat b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.week{display:flex;justify-content:space-between;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line);margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;background:var(--card2);border:2px solid var(--line);font-style:normal}
.wd.on i{background:var(--flame);border-color:var(--flame);color:#081230}
.wd.fz i{background:var(--blue3);border-color:var(--blue3);color:#081230}
.wd.now{color:var(--text)}.wd.now i{border-color:var(--blue3)}
.wd svg{width:15px;height:15px}
/* academy path */
.chapter{margin:22px 0 6px;padding:14px 16px;border-radius:18px;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;gap:12px}
.chapter .n{font-weight:900;color:var(--blue3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.chapter h3{font-size:17px;font-weight:900}
.chapter .cnt{margin-left:auto;font-weight:800;color:var(--muted)}
.path{display:grid;gap:40px;padding:18px 0 30px}
.node{position:relative;width:72px;height:72px;justify-self:center;border-radius:50%;border:0;display:grid;place-items:center;background:#1C3170;box-shadow:0 6px 0 var(--deep);color:var(--muted)}
.node svg{width:28px;height:28px}
.node.done{background:var(--blue2);color:#fff;box-shadow:0 6px 0 #2a4fb3}
.node.cur{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--blue3);animation:pulse 1.8s infinite}
.node.locked{opacity:.55}
.node .lbl{position:absolute;top:100%;margin-top:10px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
/* sheet & overlay */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,6,18,.72);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:26px;border-bottom:2px solid var(--line);max-height:86%}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:23px;font-weight:900;margin:8px 0}
.sheet p{margin:8px 0;color:#CBD6F2}
.box{margin-top:14px;padding:14px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.box h4{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--blue3);margin-bottom:6px}
.src{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);padding:12px;border-radius:14px;background:var(--card2);border:2px solid var(--line)}
.src svg{width:26px;height:26px;flex:none;color:var(--blue3)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card2);border-radius:14px;padding:11px 12px;font-size:15px;font-weight:700;margin-top:8px;color:var(--text)}
.opt.right{border-color:var(--good);background:#0f3a33}
.opt.wrong{border-color:var(--bad);background:#3a1622;animation:shake .35s}
.prayer{white-space:pre-line;font-size:18px;line-height:1.6;font-weight:600;color:var(--text)}
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.overlay.on{display:flex}
.ov-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.x{width:44px;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center}
.x svg{width:20px;height:20px}
.big{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.breath{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#5B93FF,#1B47B8);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 0 60px rgba(91,147,255,.35);margin:30px auto}
.fig{width:220px;height:220px;margin:6px auto;display:block;color:var(--blue3)}
.fig .b{animation-duration:2.4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:fill-box}
.a-hang .b{animation-name:sway;transform-origin:50% 0}
.a-scap .b{animation-name:scap}
.a-pull .b{animation-name:pull;animation-duration:3.2s}
.a-push .b{animation-name:push;transform-origin:100% 100%}
.a-squat .up{animation:squatU 2.4s ease-in-out infinite}
.a-squat .legs{animation:squatL 2.4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.a-core .leg{animation:core 2.4s ease-in-out infinite;transform-origin:0 50%;transform-box:fill-box}
.a-row .b{animation-name:row}
.a-warm .arm{animation:spin 1.6s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes scap{50%{transform:translateY(-6px)}}
@keyframes pull{0%,15%{transform:translateY(0)}50%,60%{transform:translateY(-44px)}100%{transform:translateY(0)}}
@keyframes push{50%{transform:rotate(-9deg)}}
@keyframes squatU{50%{transform:translateY(26px)}}
@keyframes squatL{50%{transform:scaleY(.6)}}
@keyframes core{50%{transform:rotate(-18deg)}}
@keyframes row{50%{transform:translateY(-16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--card2);border:2px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:800;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}
.confetti{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.celebrate{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(6,14,38,.88)}
.celebrate.on{display:grid}
.cbox{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;margin:14px 0 4px;position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:5}
.segc button{border:0;border-radius:12px;min-height:42px;font-weight:900;font-size:15px;background:none;color:var(--muted)}
.segc button{min-height:44px}
.chip{min-width:44px}
.segc button[aria-selected="true"]{background:var(--blue);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.feedback{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--card2);border-left:0;font-size:15px;color:#DDE6FB;white-space:pre-line}
.cardq{min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:18px;font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:800}
.num{font-variant-numeric:tabular-nums;text-align:right!important}
.tick{width:44px!important;height:44px!important;border-radius:22px!important}
.chip{min-height:44px}
.btn.sm{min-height:44px}
label.lc{min-height:44px;align-items:center}
.tbl .tbtn{min-height:44px;justify-content:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3: Liquid Glass for the control layer, motion ===== */
html{background:#060E26}
body{background:transparent}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#0C1C4A 0%,#081230 55%,#060E26 100%)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform;opacity:.55}
.bgfx i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:#1B3FA8;animation:drift1 26s ease-in-out infinite alternate}
.bgfx i:nth-child(2){width:55vmax;height:55vmax;right:-25vmax;top:30vh;background:#0F2E86;animation:drift2 32s ease-in-out infinite alternate}
.bgfx i:nth-child(3){width:40vmax;height:40vmax;left:10vw;bottom:-20vmax;background:#2F6BFF;opacity:.22;animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.1)}}
@keyframes drift2{to{transform:translate(-14vw,-8vh) scale(.92)}}
.glass{background:rgba(18,36,92,.46);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.04),0 12px 32px rgba(0,0,0,.38)}
main{padding-top:0}
.top{position:sticky;top:0;z-index:15;margin:0 -16px 14px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(8,18,48,.42);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.08)}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.pill.bump{animation:bump .6s cubic-bezier(.3,1.8,.4,1)}
@keyframes bump{30%{transform:scale(1.18)}}
.avatar{width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
nav.tabs{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);border-radius:30px;padding:6px;border-top:1px solid rgba(255,255,255,.13);background:rgba(18,36,92,.48);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 14px 34px rgba(0,0,0,.45);max-width:560px;margin:0 auto}
nav.tabs .in{position:relative}
nav.tabs .lens{position:absolute;top:0;bottom:0;width:20%;left:calc(var(--i,0) * 20%);border-radius:24px;background:rgba(120,160,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 0 12px rgba(150,190,255,.15);transition:left .5s cubic-bezier(.3,1.35,.4,1);pointer-events:none}
nav.tabs button{position:relative;z-index:1;padding:8px 0 9px;transition:color .3s}
nav.tabs button svg{transition:transform .4s cubic-bezier(.3,1.6,.4,1)}
nav.tabs button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}
main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.segc{top:calc(env(safe-area-inset-top) + 70px);background:rgba(18,36,92,.5);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px rgba(0,0,0,.3)}
.segc button[aria-selected="true"]{background:rgba(91,147,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);animation:bump .45s cubic-bezier(.3,1.6,.4,1)}
@media (min-width:900px){
 nav.tabs{left:auto;right:auto;bottom:auto;border-radius:0;margin:0;border:0;border-right:1px solid rgba(255,255,255,.1);box-shadow:none}

    else if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")merge(a[k],b[k]);

}

   Data key (AES-GCM 256) encrypts {P,R,N,wish,priv}. It is wrapped by the PIN (PBKDF2)
   and, if available, by Face ID (WebAuthn PRF). New entries can be written while locked:
   they are sealed to the vault's public key (ECDH P-256) and merged on the next unlock. */
var VK="jos2-vault",V={meta:null,key:null,D:null,hidAt:0,idle:null,fails:0,waitTill:0};try{var lk=JSON.parse(localStorage.getItem("jos2-lk")||"{}");V.fails=lk.f||0;V.waitTill=lk.w||0}catch(e){}

var TE=new TextEncoder(),TD=new TextDecoder(),CS=(window.crypto&&crypto.subtle)||null;
function b64(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function ub64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}
async function pinKey(pin,salt,iter){var base=await CS.importKey("raw",TE.encode(pin),"PBKDF2",false,["deriveKey"]);return CS.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function aesEnc(key,bytes){var iv=rnd(12);var ct=await CS.encrypt({name:"AES-GCM",iv:iv},key,bytes);return {iv:b64(iv),ct:b64(ct)}}
async function aesDec(key,o){return new Uint8Array(await CS.decrypt({name:"AES-GCM",iv:ub64(o.iv)},key,ub64(o.ct)))}
async function prfKey(bytes){var base=await CS.importKey("raw",bytes,"HKDF",false,["deriveKey"]);return CS.deriveKey({name:"HKDF",hash:"SHA-256",salt:TE.encode("jeremia-os-vault"),info:TE.encode("wrap")},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("jos2",1);r.onupgradeneeded=function(){r.result.createObjectStore("k")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function idbGet(k){var d=await idb();return new Promise(function(res,rej){var t=d.transaction("k").objectStore("k").get(k);t.onsuccess=function(){res(t.result)};t.onerror=function(){rej(t.error)}})}
async function idbSet(k,v){var d=await idb();return new Promise(function(res,rej){var t=d.transaction("k","readwrite").objectStore("k").put(v,k);t.onsuccess=function(){res()};t.onerror=function(){rej(t.error)}})}
function vOpenNow(){return !!V.key}
function vReady(){return !!V.meta}
function bindPrivate(){if(V.D){PR=V.D.P;REF=V.D.R;NOTES=V.D.N}else{PR=null;REF=null;NOTES=null}}
async function vaultSave(){if(!V.key||!V.D)return;V.meta.data=await aesEnc(V.key,TE.encode(JSON.stringify(V.D)));vSaveMeta()}
function applyItem(kind,o){var D=V.D;
  if(kind==="pr")D.P.items.push(o);
  else if(kind==="refl"){var m=monthOf(o.d);if(!D.R[m])D.R[m]={};D.R[m][o.d]=o}
  else if(kind==="note"){var n=monthOf(o.d);if(!D.N[n])D.N[n]=[];D.N[n].push(o)}
  else if(kind==="wish")D.wish=o.t;
}
async function sealAdd(kind,o){
  var pub=await CS.importKey("jwk",V.meta.pub,{name:"ECDH",namedCurve:"P-256"},false,[]);
  var eph=await CS.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]);
  var k=await CS.deriveKey({name:"ECDH",public:pub},eph.privateKey,{name:"AES-GCM",length:256},false,["encrypt"]);
  var box=await aesEnc(k,TE.encode(JSON.stringify({k:kind,o:o})));box.e=await CS.exportKey("jwk",eph.publicKey);
  V.meta.inbox.push(box);vSaveMeta();
}
async function vAdd(kind,o){ /* write a private entry, locked or not */
  if(!V.meta)throw new Error("novault");
  if(V.key){applyItem(kind,o);await vaultSave()}else await sealAdd(kind,o);
}
async function vOpenWith(dk){
  V.key=await CS.importKey("raw",dk,{name:"AES-GCM"},false,["encrypt","decrypt"]);
  V.D=JSON.parse(TD.decode(await aesDec(V.key,V.meta.data)));
  if(V.meta.inbox&&V.meta.inbox.length){
    var priv=await CS.importKey("jwk",V.D.priv,{name:"ECDH",namedCurve:"P-256"},false,["deriveKey"]);
    for(var i=0;i<V.meta.inbox.length;i++){var b=V.meta.inbox[i];try{var ep=await CS.importKey("jwk",b.e,{name:"ECDH",namedCurve:"P-256"},false,[]);var k=await CS.deriveKey({name:"ECDH",public:ep},priv,{name:"AES-GCM",length:256},false,["decrypt"]);var x=JSON.parse(TD.decode(await aesDec(k,b)));applyItem(x.k,x.o)}catch(e){}}
    V.meta.inbox=[];await vaultSave();
  }
  bindPrivate();vIdle();
}
async function vCreate(pin){
  var dk=rnd(32),salt=rnd(16),iter=310000;
  var kp=await CS.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]);
  var pub=await CS.exportKey("jwk",kp.publicKey),priv=await CS.exportKey("jwk",kp.privateKey);
  var pk=await pinKey(pin,salt,iter);
  var key=await CS.importKey("raw",dk,{name:"AES-GCM"},false,["encrypt","decrypt"]);
  var D={P:{items:[]},R:{},N:{},wish:"",priv:priv};
  V.meta={v:1,pub:pub,inbox:[],pin:{salt:b64(salt),iter:iter,w:await aesEnc(pk,dk)},bio:null,data:await aesEnc(key,TE.encode(JSON.stringify(D)))};
  vSaveMeta();V.key=key;V.D=D;V.dk=dk;bindPrivate();vIdle();
}
async function vUnlockPin(pin){
  if(Date.now()<V.waitTill)throw new Error("wait");
  try{var p=V.meta.pin;var pk=await pinKey(pin,ub64(p.salt),p.iter);var dk=await aesDec(pk,p.w);V.fails=0;try{localStorage.removeItem("jos2-lk")}catch(x){}V.dk=dk;await vOpenWith(dk)}
  catch(e){V.fails++;if(V.fails>=5){V.waitTill=Date.now()+30000*Math.pow(2,Math.min(6,(V.lv=(V.lv||0)+1)-1));V.fails=0}try{localStorage.setItem("jos2-lk",JSON.stringify({f:V.fails,w:V.waitTill}))}catch(x){}throw new Error("pin")}
}
function bioOk(){return !!(window.PublicKeyCredential&&navigator.credentials&&CS)}
async function vEnrollBio(){ /* needs an open vault (V.dk) */
  if(!bioOk()||!V.dk)throw new Error("nobio");
  var cred=await navigator.credentials.create({publicKey:{rp:{name:"Jeremia OS"},user:{id:rnd(16),name:"Jeremia OS Tresor",displayName:"Jeremia OS Tresor"},challenge:rnd(32),pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,extensions:{prf:{}}}});
  var id=b64(cred.rawId),ext=(cred.getClientExtensionResults&&cred.getClientExtensionResults())||{};
  var salt=rnd(32),bio=null;
  if(ext.prf&&ext.prf.enabled!==false){
    try{var a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:ub64(id)}],userVerification:"required",timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
      var r=(a.getClientExtensionResults()||{}).prf;

function pacerReps(ex,total){
  pacerStop();var x=EX[ex];if(!x.p){pacerSet(0,"Los",total+" Wdh.");return}
  var A=x.p[0],B=x.p[1],cyc=A[1]+B[1],t0=performance.now()+800,done=false;
  pacerSet(0,"Bereit","0 von "+total);
  (function step(now){
    var t=(now-t0)/1000;if(t<0){PCR=requestAnimationFrame(step);return}
    var k=Math.floor(t/cyc);if(k>=total){if(!done){done=true;pacerSet(1,"Satz geschafft",total+" von "+total);beep();}PCR=null;return}
    var r=t-k*cyc,inA=r<A[1],f=inA?r/A[1]:(r-A[1])/B[1];
    if(!pacerSet(inA?f:1-f,inA?A[0]:B[0],(k+1)+" von "+total)){PCR=null;return}
    PCR=requestAnimationFrame(step);
  })(performance.now());
}

function doImport(txt){

  if(o.vault){V.meta=o.vault;if(V.meta.bio&&V.meta.bio.mode==="gate")V.meta.bio=null;vSaveMeta();vLock(true);toast("Backup eingespielt. Öffne den Tresor mit deinem PIN.");closeSheet();render();return}
  var items=[];
  if(o.P&&o.P.items)o.P.items.forEach(function(p){items.push(["pr",p])});
  if(o.R)Object.keys(o.R).forEach(function(m){Object.keys(o.R[m]||{}).forEach(function(d){var r=o.R[m][d];delete r.fb;items.push(["refl",r])})});
  if(o.N)Object.keys(o.N).forEach(function(m){(o.N[m]||[]).forEach(function(x){items.push(["note",x])})});
  function seal(){var p=Promise.resolve();items.forEach(function(it){p=p.then(function(){return vAdd(it[0],it[1])})});return p.then(function(){toast("Backup eingespielt"+(items.length?", private Einträge sind im Tresor":""));render()})}

  seal();
}

  var hl=st.ex==="warm"?"Aufwärmen":"Halten";if(timed){if(!WO.running)pacerSet(1,hl,st.amt>=120?Math.round(st.amt/60)+" Min.":st.amt+" Sek.");else pacerSet(WO.left/st.amt,hl,WO.left+" Sek.")}else pacerReps(st.ex,st.amt);
